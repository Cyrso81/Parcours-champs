<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcours Champs</title>
<style>
body{margin:0;background:#f1f8e9;font-family:Arial;text-align:center}
header{background:#2e7d32;color:white;padding:10px}
button{padding:12px;margin:5px;font-size:16px}
#map{height:65vh;width:100%}
</style>
</head>
<body>
<header><h1>🌾 Parcours Champs</h1></header>
<button onclick="maPosition()">📍 Ma position</button>
<button onclick="demarrerTrace()">▶️ Tracer</button>
<button onclick="arreterTrace()">⏹️ Arrêter</button>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=L.map('map').setView([46.6,2.4],6);
setTimeout(()=>map.invalidateSize(),500);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker,trace,points=[],watch;

function maPosition(){
 navigator.geolocation.getCurrentPosition(p=>{
  let x=[p.coords.latitude,p.coords.longitude];
  if(marker) marker.setLatLng(x);
  else marker=L.marker(x).addTo(map);
  map.setView(x,17);
 },()=>alert("GPS non disponible"));
}
  function demarrerTrace(){
 points=[];
 if(trace) map.removeLayer(trace);
 watch=navigator.geolocation.watchPosition(p=>{
  let x=[p.coords.latitude,p.coords.longitude];
  points.push(x);
  if(!trace) trace=L.polyline(points).addTo(map);
  else trace.setLatLngs(points);
 });
}

function arreterTrace(){
 if(watch) navigator.geolocation.clearWatch(watch);
}
  function effacerTrace(){
 if(trace) map.removeLayer(trace);
 trace=null;
 points=[];
}
</script>
</body>
</html>
