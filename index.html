<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
#map {
height: 70vh;
}
  </style>
<style>
  <header>
<h2>🌾 Parcours Champs</h2>
</header>

<button onclick="meLocaliser()">📍 Me localiser</button>

<div id="map"></div>
body {
  font-family: Arial;
  margin: 0;
  background: #f1f8e9;
  text-align: center;
}

header {
  background: #2e7d32;
  color: white;
  padding: 25px;
}
main{padding:20px}
button{display:block;width:100%;padding:15px;margin:15px 0;font-size:18px;background:#2e7d32;color:white;border:0;border-radius:10px}
</style>
</head>
<body>

<header>
<h1>🌾 Parcours Champs</h1>
<p>Application de suivi des parcelles</p>
</header>

<main>
<h2>📍 Mes parcelles</h2>
<p>Bienvenue dans Parcours Champs.</p>

<button onclick="ajouterParcelle()">➕ Ajouter une parcelle</button>
<button onclick="voirParcours()">🗺️ Voir mes parcours</button>
</main>
  <div id="map" style="height: 500px;"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([43.6, 1.4], 15);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{attribution:'© Esri'}
).addTo(map);
</script>
  <script>
function meLocaliser() {
  map.locate({
    setView: true,
    maxZoom: 19,
    enableHighAccuracy: true
  });
}

map.on('locationfound', function(e) {
  L.marker(e.latlng)
    .addTo(map)
    .bindPopup("📍 Vous êtes ici")
    .openPopup();
});

map.on('locationerror', function() {
  alert("Position GPS impossible.");
});
  let traceActive = false;
let positionGPS;
let pointsParcelle = [];
let traceParcelle;

function ajouterParcelle() {
    traceActive = true;
    pointsParcelle = [];

    alert("Mode tracé activé ! Déplacez-vous sur la parcelle.");

    if (traceParcelle) {
        map.removeLayer(traceParcelle);
    }

    traceParcelle = L.polyline([], {
        weight: 4
    }).addTo(map);

    map.locate({
        watch: true,
        enableHighAccuracy: true
    });
}

function voirParcours() {
    alert("Mes parcours seront affichés ici.");
}s
  </script>
</body>
</html>
