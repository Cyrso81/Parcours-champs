<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<head>
<meta charset="UTF-8">
<title>Parcours Champs</title>
</head>
<body>
<h1>🌾 Parcours Champs</h1>
  <button id="gps" style="padding:12px 20px;font-size:16px">📍 Ma position</button>
<div id="map" style="height:70vh"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <div style="padding:10px">
  </div>
  <script>
var map=L.map('map').setView([46.6,2.4],6);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
  </script>
  function maPosition(){
 navigator.geolocation.getCurrentPosition(function(p){
  var pos=[p.coords.latitude,p.coords.longitude];
  map.setView(pos,17);
  L.marker(pos).addTo(map);
 });
}
  <script>
document.getElementById("gps").onclick=function(){
 navigator.geolocation.getCurrentPosition(function(p){
  var pos=[p.coords.latitude,p.coords.longitude];
  map.setView(pos,17);
  L.marker(pos).addTo(map);
 });
};
  </script>
</body>
</html>
